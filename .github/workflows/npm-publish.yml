name: Publish npm packages

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Require the tag commit to be on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Tag commit $GITHUB_SHA is not reachable from origin/main." >&2
            exit 1
          }

      - name: Match tag and package versions
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/verify-package-versions.mjs "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm

      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@^11.5.1

      - name: Install dependencies reproducibly
        run: npm ci

      - name: Build, test, and inspect packages
        run: npm run release:check

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js for npmjs.org
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@^11.5.1

      - name: Install dependencies reproducibly
        run: npm ci

      - name: Build packages
        run: npm run build:packs

      - name: Publish core, domain packs, then all
        run: node scripts/publish-packages.mjs
